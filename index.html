<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 编辑器</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css"><link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css"><link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.min.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header id="bar">
  <div class="brand"><span class="logo">CSS</span><span class="brand-name">样式表编辑器</span></div>
  <div class="file-wrap"><span class="file-dot"></span><span id="file">未打开文件</span></div>
  <div class="actions">
    <button id="save" class="primary">保存</button>
    <button id="format">格式化</button>

  </div>
  <select id="theme" title="界面风格"><option value="lyra">经典蓝</option><option value="violet">深空紫</option><option value="emerald">森林绿</option><option value="sunset">暖阳橙</option><option value="sakura">樱花粉</option><option value="light">极简白</option></select>
  <span id="status" class="status-pill">就绪</span>
</header>
<main id="main">
  <div id="editorColumn">
    <section id="editorPane">
      <div class="pane-head"><span class="pane-dot"></span><span id="tabName">style.css</span><span class="pane-meta" id="cursorPos">Ln 1, Col 1</span></div>
      <div class="editor-wrap"><textarea id="code"></textarea></div>
    </section>
    <div id="panelSplitter" title="拖动调整问题面板高度"></div>
    <div id="problemsPanel" class="problems-panel">
      <div class="problems-head">
        <button class="problem-tab active" type="button">问题 <span id="problemCount">0</span></button>
        <span class="problem-summary" id="problemSummary">未检测到问题</span>
      </div>
      <div id="problemsList" class="problems-list"></div>
    </div>
  </div>
  <div id="splitter" title="拖动调整宽度"></div>
  <section id="previewPane">
    <div class="pane-head"><span class="pane-dot preview"></span><span>实时预览</span><button id="previewRefresh" class="pane-btn" title="刷新预览">↻</button><span class="pane-meta" id="previewInfo">自动刷新</span></div>
    <div class="preview-card"><iframe id="preview"></iframe></div>
  </section>
</main>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
<script src="vendor/codemirror/addon/hint/css-hint.min.js"></script>
<script src="vendor/codemirror/addon/fold/foldcode.min.js"></script>
<script src="vendor/codemirror/addon/fold/brace-fold.min.js"></script>
<script src="vendor/codemirror/addon/fold/foldgutter.min.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="app.js?v=1.0.16"></script>
</body></html>
